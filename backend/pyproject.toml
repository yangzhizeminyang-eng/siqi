[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.3",
    "deepagents>=0.5.0",
    "fastapi[standard]>=0.141.1",
    "mcp>=1.12.0,<2.0.0",
    "langchain>=0.3.0",
    "langgraph>=0.6.0",
    "llama-index-core>=0.14.0",
    "llama-index-readers-file>=0.5.0",
    "llama-index-vector-stores-milvus>=0.6.0",
    "milvus-lite>=2.5.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "pymysql>=1.2.0",
    "pymilvus[milvus_lite]>=2.5.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
    "alembic>=1.19.2",
    "langchain-openai>=1.6.0",
    "tree-sitter-language-pack>=1.16.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "fakeredis[lua]>=2.40.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "requires_redis: 需要可达的 Redis broker（TEST_REDIS_URL 或本地 127.0.0.1:6379）；不可达时归类为环境缺失自动 skip（OPT-05）",
]
