# Nginx 主配置（非 root 运行兼容）。
# 由 frontend/Dockerfile 复制为 /etc/nginx/nginx.conf（共享：团队版/企业版均非 root）。
# 关键点：
#   - 移除了 setuid 用户指令：非 root master 下该指令会报错（需超级用户才可 setuid）。
#   - `pid /tmp/nginx.pid`：/tmp 世界可写，非 root 可写。
#   - 临时/代理/快速 CGI 缓存路径均落到 /tmp/nginx_*，并交由 Dockerfile chown 给 nginx；不在 /var 写。
#   - 保持 `listen 8080`（site conf）与 /health、/api 反代、SPA fallback 不变。
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # 非 root 可写的临时/缓存目录（无需提升权限）
    client_body_temp_path /tmp/nginx_client;
    proxy_temp_path /tmp/nginx_proxy;
    fastcgi_temp_path /tmp/nginx_fastcgi;
    uwsgi_temp_path /tmp/nginx_uwsgi;
    scgi_temp_path /tmp/nginx_scgi;

    include /etc/nginx/conf.d/*.conf;
}