# E3-09 专用 Milvus 叠加：全新数据卷 + 宿主机 19530，独立于既有 enterprise 卷（避免 minio 凭据冲突）。
# 用法：
#   export ENTERPRISE_MINIO_ROOT_USER=enterprise-minio
#   export ENTERPRISE_MINIO_ROOT_PASSWORD=<你的随机>
#   docker compose -f deploy/docker-compose.enterprise.yml -f deploy/docker-compose.milvus-e309.override.yml \
#       up -d etcd-enterprise minio-enterprise milvus-enterprise
services:
  etcd-enterprise:
    volumes:
      - e309_milvus_etcd_data:/etcd
  minio-enterprise:
    volumes:
      - e309_milvus_minio_data:/minio_data
  milvus-enterprise:
    volumes:
      - e309_milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"

volumes:
  e309_milvus_data: {}
  e309_milvus_etcd_data: {}
  e309_milvus_minio_data: {}

networks:
  # E3-09 复跑需要宿主机直连 19530；milvus 网络去 internal 以便 Docker 发布端口（etcd/minio 仍 internal）
  milvus:
    name: agent_enterprise_milvus
    internal: false